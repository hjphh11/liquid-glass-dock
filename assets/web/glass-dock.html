<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liquid Glass Dock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --tabw: 92px;
    --dock-h: 62px;
    --inset: 5px;
    --ink: #ffffff;
    --muted: rgba(235, 235, 245, .55);
    --tint: rgba(0, 0, 0, .24);
    /* 真实项目里换成页面自己的背景图/封面墙；此处由 JS 画一张再转 dataURL，保证副本严丝合缝 */
    --art: none;
  }
  html, body { height: 100%; }
  body {
    background: #0b0b10;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .aura {
    position: fixed; inset: 0;
    background-color: #0b0b10;
    background-image: var(--art);
    background-size: 100vw 100vh;
    background-position: 0 0;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .caption {
    position: fixed; top: 28px; left: 0; right: 0;
    text-align: center; font-size: 12px; letter-spacing: .16em;
    color: rgba(255, 255, 255, .38);
  }

  .dock {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    height: var(--dock-h);
    padding: var(--inset);
    border-radius: calc(var(--dock-h) / 2);
    background: var(--tint);
    backdrop-filter: blur(5px) saturate(1.5);
    -webkit-backdrop-filter: blur(5px) saturate(1.5);
    box-shadow: 0 14px 26px rgba(0, 0, 0, .38);
    touch-action: none;
    user-select: none;
    z-index: 10;
  }
  .dock::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.06) 42%, rgba(255,255,255,.02) 68%, rgba(255,255,255,.34));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }

  .row { display: flex; }
  .cell {
    width: var(--tabw); height: calc(var(--dock-h) - var(--inset) * 2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
  }
  .cell svg { width: 22px; height: 22px; display: block; }
  .cell span { font-size: 11px; line-height: 1; font-weight: 500; color: var(--muted); }
  .cell.on span { font-weight: 600; color: var(--ink); }
  .cell.on svg { fill: var(--ink); }
  .cell svg { fill: var(--muted); }

  .ind {
    position: absolute;
    top: var(--inset);
    left: var(--inset);
    width: var(--tabw);
    height: calc(var(--dock-h) - var(--inset) * 2);
    border-radius: calc((var(--dock-h) - var(--inset) * 2) / 2);
    overflow: hidden;
    will-change: transform;
    cursor: grab;
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, .50),
      inset 0 1px 0 rgba(255, 255, 255, .92),
      inset 0 -1px 2px rgba(0, 0, 0, .22),
      0 2px 8px rgba(0, 0, 0, .34);
  }
  .ind-bg {
    position: absolute; inset: 0;
    background-color: #0b0b10;
    background-image: var(--art);
    background-size: 100vw 100vh;
    background-position: 0 0;
    background-repeat: no-repeat;
    background-attachment: fixed;
    filter: saturate(1.15) brightness(1.06);
  }
  .ind-tint {
    position: absolute; inset: 0;
    background: rgba(255, 255, 255, .13);
  }
  .ind-track {
    position: absolute; top: 0; left: 0;
    display: flex;
    will-change: transform;
  }
  .ind.liquid { filter: url(#lens); }
  .ind.dragging { cursor: grabbing; }
</style>
</head>
<body>
<div class="aura"></div>
<p class="caption">拖动导航栏试试</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lens" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence id="lensNoise" type="fractalNoise" baseFrequency="0.014 0.022" numOctaves="2" seed="9" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.6" result="soft"/>
    <feDisplacementMap id="lensMap" in="SourceGraphic" in2="soft" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<nav class="dock" id="dock">
  <div class="row" id="gray"></div>
  <div class="ind" id="ind">
    <div class="ind-bg"></div>
    <div class="ind-tint"></div>
    <div class="ind-track" id="track"></div>
  </div>
</nav>

<script>
const ICONS = {
  home: 'M12 5.69l5 4.5V18h-2v-6H9v6H7v-7.81l5-4.5M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z',
  homeSolid: 'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z',
  search: 'M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
  trend: 'M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z',
  person: 'M12 6c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2m0 10c2.7 0 5.8 1.29 6 2H6c.23-.72 3.31-2 6-2m0-12C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 10c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',
  personSolid: 'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'
};
const TABS = [
  { label: '首页', icon: ICONS.home, on: ICONS.homeSolid },
  { label: '搜索', icon: ICONS.search, on: ICONS.search },
  { label: '排行榜', icon: ICONS.trend, on: ICONS.trend },
  { label: '我的', icon: ICONS.person, on: ICONS.personSolid }
];

// 画一张 4×6 的封面墙当页面背景，转 dataURL 后 body 与指示器副本共用同一张图 → 像素级对齐
(function paintWall() {
  const W = 720, H = 1280, cols = 4, rows = 6;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const pal = [
    ['#7a3418', '#d08a3a'], ['#0f3b52', '#3d9fbf'], ['#3a1c4d', '#8455aa'], ['#11362a', '#37a273'],
    ['#4d1a24', '#b04052'], ['#1a2338', '#44639e'], ['#3d2a0e', '#b98c33'], ['#241a2e', '#6a4f84']
  ];
  const cw = W / cols, ch = H / rows;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const [a, b] = pal[(x * 3 + y * 5) % pal.length];
      const grd = g.createLinearGradient(x * cw, y * ch, (x + 1) * cw, (y + 1) * ch);
      grd.addColorStop(0, a);
      grd.addColorStop(1, b);
      g.fillStyle = grd;
      g.fillRect(x * cw, y * ch, cw, ch);
      const cx = x * cw + cw / 2, cy = y * ch + ch * 0.4, r = Math.min(cw, ch) * 0.34;
      g.strokeStyle = 'rgba(0,0,0,.20)';
      g.lineWidth = 1.5;
      for (let i = 1; i <= 9; i++) {
        g.beginPath();
        g.arc(cx, cy, r * i / 9, 0, Math.PI * 2);
        g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,.28)';
      g.beginPath();
      g.arc(cx, cy, r * 0.2, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = 'rgba(0,0,0,.24)';
      g.fillRect(x * cw + cw * 0.1, y * ch + ch * 0.77, cw * 0.8, ch * 0.045);
      g.fillStyle = 'rgba(255,255,255,.5)';
      g.fillRect(x * cw + cw * 0.1, y * ch + ch * 0.86, cw * 0.46, ch * 0.026);
    }
  }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.18, W / 2, H / 2, H * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
  document.documentElement.style.setProperty('--art', `url("${c.toDataURL('image/jpeg', .82)}")`);
})();

const dock = document.getElementById('dock');const gray = document.getElementById('gray');
const track = document.getElementById('track');
const ind = document.getElementById('ind');
const lensMap = document.getElementById('lensMap');

const cell = (t, on) =>
  `<div class="cell${on ? ' on' : ''}"><svg viewBox="0 0 24 24"><path d="${on ? t.on : t.icon}"/></svg><span>${t.label}</span></div>`;

gray.innerHTML = TABS.map(t => cell(t, false)).join('');
track.innerHTML = TABS.map(t => cell(t, true)).join('');

let tabW = 92, maxX = 0, x = 0, target = 0, raf = 0, vel = 0;
let dragging = false, moved = false, press = 0;

function measure() {
  const n = TABS.length;
  tabW = Math.max(64, Math.min(92, (window.innerWidth - 36) / n));
  maxX = tabW * (n - 1);
  document.documentElement.style.setProperty('--tabw', tabW + 'px');
  const dockW = tabW * n + 10;
  dock.style.width = dockW + 'px';
  dock.style.left = Math.round((window.innerWidth - dockW) / 2) + 'px';
  track.style.width = tabW * n + 'px';
  x = Math.min(x, maxX);
  render();
}

function render() {
  ind.style.transform = `translate3d(${x}px,0,0) scale(${1 + .08 * press})`;
  track.style.transform = `translate3d(${-x}px,0,0)`;
  lensMap.setAttribute('scale', String(press * 12));
}

function animateTo(to, v0 = 0) {
  cancelAnimationFrame(raf);
  let v = v0 * 0.12;
  const step = () => {
    const dx = to - x;
    v += dx * 0.22;
    v *= 0.72;
    x += v;
    if (Math.abs(dx) < .2 && Math.abs(v) < .2) { x = to; render(); return; }
    render();
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function pressTo(v) {
  press = v;
  ind.classList.toggle('liquid', v > .02);
  render();
}

function projectFling(v) { return v * 0.998 / (1 - 0.998) / 1000; }

let startX = 0, startPos = 0, onIndicator = false, lastIndex = 0, tracker = [], tStart = 0;

dock.addEventListener('pointerdown', e => {
  dock.setPointerCapture(e.pointerId);
  const rect = dock.getBoundingClientRect();
  const px = e.clientX - rect.left - 5 - tabW / 2;
  onIndicator = Math.abs(px - x) < tabW / 2;
  startX = e.clientX;
  startPos = onIndicator ? x : Math.max(0, Math.min(maxX, px));
  if (!onIndicator) animateTo(startPos);
  moved = false;
  tracker = [{ t: e.timeStamp, x: e.clientX }];
  tStart = e.timeStamp;
  dragging = true;
  ind.classList.add('dragging');
  pressTo(1);
  lastIndex = Math.round(startPos / tabW);
});

dock.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - startX;
  if (!moved && Math.abs(dx) > 6) moved = true;
  if (!moved) return;
  tracker.push({ t: e.timeStamp, x: e.clientX });
  const raw = startPos + dx;
  const lim = tabW * .4, k = .55;
  const rubber = o => o * lim * k / (lim + k * Math.abs(o));
  x = raw < 0 ? rubber(raw) : raw > maxX ? maxX + rubber(raw - maxX) : raw;
  const idx = Math.max(0, Math.min(maxX / tabW, Math.round(x / tabW)));
  if (idx !== lastIndex) { lastIndex = idx; navigator.vibrate?.(8); }
  render();
});

function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  ind.classList.remove('dragging');
  const recent = tracker.filter(p => e.timeStamp - p.t < 100);
  let v = 0;
  if (recent.length > 1) {
    const a = recent[0], b = recent[recent.length - 1];
    v = (b.x - a.x) / Math.max(1, b.t - a.t);
  }
  const projected = moved ? x + projectFling(v) : startPos;
  const idx = Math.max(0, Math.min(TABS.length - 1, Math.round(projected / tabW)));
  animateTo(idx * tabW, moved ? v : 0);
  pressTo(0);
  navigator.vibrate?.(12);
}

dock.addEventListener('pointerup', endDrag);
dock.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', measure);

measure();
animateTo(0);

// 给外部调用的小接口：嵌入页面或做演示时用得上
window.__dock = {
  select: i => animateTo(Math.max(0, Math.min(TABS.length - 1, i)) * tabW),
  press: v => pressTo(v),
  get index() { return Math.round(x / tabW); }
};
</script>
</body>
</html>
